<craft-dialog class="pixabay-modal" label="Pixabay">
    <div class="pixabay-toolbar">
        <input type="search" class="pixabay-search" autocomplete="off" placeholder="{{ 'Search'|t('app') }}" aria-label="{{ 'Search Pixabay'|t('spring-pixabay') }}">
        <select class="pixabay-search-type" aria-label="{{ 'Type'|t('app') }}">
            <option value="">{{ 'All'|t('app') }}</option>
            <option value="photo">{{ 'Photos'|t('spring-pixabay') }}</option>
            <option value="illustration">{{ 'Illustrations'|t('spring-pixabay') }}</option>
            <option value="vector">{{ 'Vector Graphics'|t('spring-pixabay') }}</option>
        </select>
    </div>
    <div class="pixabay-results" aria-live="polite">
        {{ defaultText ?? '' }}
    </div>
    <div slot="footer" class="pixabay-footer">
        {% if (logo ?? '') is not empty %}
        {# Having the logo is required by Pixabay #}
        <a href="https://pixabay.com/" title="Pixabay" target="_blank" rel="noopener" class="pixabay-logo">
            <img src="{{ logo }}" alt="Pixabay">
        </a>
        {% endif %}
        <span class="pixabay-selected" aria-live="polite">
            {# "X photos selected" #}
        </span>
        <craft-button type="button" variant="fill" class="pixabay-cancel">{{ 'Cancel'|t('app') }}</craft-button>
        <craft-button type="button" variant="primary" class="pixabay-download" disabled>{{ 'Download selected pictures'|t('spring-pixabay') }}</craft-button>
    </div>
</craft-dialog>
